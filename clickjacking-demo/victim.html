<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank - Confirm Action</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
  .card {
    max-width: 400px; margin: 60px auto; padding: 24px;
    background: #fff; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  h2 { margin-top: 0; color: #2b6cb0; }
  #confirmBtn {
    background: #2b6cb0; color: #fff; border: none;
    padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer;
  }
  #flag {
    display: none; margin-top: 16px; padding: 12px;
    background: #f0fff4; border: 1px solid #38a169; border-radius: 6px;
    font-family: monospace; word-break: break-all;
  }
</style>
</head>
<body>
<div class="card">
  <h2>SecureBank</h2>
  <p>Logged in as: victim@example.com</p>
  <p>Click below to confirm this account action.</p>
  <button id="confirmBtn">Confirm Action</button>
  <div id="flag">UTeMCS{cl1ckj4ck1ng_1s_r34l}</div>
</div>
<script>
  document.getElementById('confirmBtn').addEventListener('click', function () {
    document.getElementById('flag').style.display = 'block';
  });
</script>
</body>
</html>
